name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------- CONTINUOUS INTEGRATION ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "image=${REGISTRY}/${IMAGE_NAME,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.vars.outputs.image }}
      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.vars.outputs.image }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: docker push ${{ steps.vars.outputs.image }}

  # ---------- CONTINUOUS DEPLOYMENT ----------
  # Deploys the image as a container on the runner and smoke-tests it.
  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions: { packages: read }
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to staging
        run: |
          docker pull ${{ needs.build.outputs.image }}
          docker run -d --name staging -p 3000:3000 -e APP_VERSION=staging-${GITHUB_SHA::7} ${{ needs.build.outputs.image }}
          sleep 5
      - name: Smoke test
        run: |
          curl -sf http://localhost:3000/health
          curl -sf http://localhost:3000/ | grep "CI/CD demo"

  deploy-production:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    permissions: { packages: read }
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to production
        run: |
          docker pull ${{ needs.build.outputs.image }}
          docker run -d --name production -p 3000:3000 -e APP_VERSION=prod-${GITHUB_SHA::7} ${{ needs.build.outputs.image }}
          sleep 5
      - name: Smoke test
        run: |
          curl -sf http://localhost:3000/health
          curl -sf http://localhost:3000/api/info
